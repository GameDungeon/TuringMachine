[package]
name = "TuringMachine"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic="abort"

[dependencies]

[build-dependencies]
prettyplease = {version = "0.3.0", features = ["verbatim"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }


